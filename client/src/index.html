<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mazefeed</title>
    <meta
      name="description"
      content="A real-time multiplayer maze-racing game for up to 10 players. Everyone gets their own copy of the same maze - race your rat to the cheese before the timer runs out."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- "Add to Home Screen" support: iOS Safari has no Fullscreen API at all
         (not even for Chrome-for-iOS, since every iOS browser is required to
         use WebKit under the hood), so a chrome-less standalone launch via a
         home-screen icon is the closest thing to fullscreen iPhone allows. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mazefeed" />
    <meta name="theme-color" content="#0b0b0e" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
